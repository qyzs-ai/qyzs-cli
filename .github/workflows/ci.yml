name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  rust-check:
    name: Rust Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Version consistency (tag vs Cargo.toml)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO_VER="$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          if [ "$TAG" != "$CARGO_VER" ]; then
            echo "::error::tag v${TAG} != Cargo.toml ${CARGO_VER}: 打 tag 前需在发布准备提交中对齐版本号 (docs/RELEASE.md §2)"
            exit 1
          fi
      - name: Cargo Format
        run: cargo fmt --all -- --check
      - name: Cargo Check
        run: cargo check --verbose
      - name: Cargo Clippy
        run: cargo clippy --all-targets -- --deny warnings
      - name: Cargo Test
        run: cargo test --verbose
      # 界面语言会改变部分运行时文案 (阶段描述等), 用例若硬编码某一种语言的
      # 字符串, 就会在另一种 locale 的 runner 上失败 —— 两种语言各跑一遍守住
      - name: Cargo Test (English locale)
        run: cargo test --verbose
        env:
          QYZS_LANG: en
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8

  # 提交历史密钥门禁: 凭据一旦写入历史就必须重写历史, 因此在提交环节拦住。
  # 需 fetch-depth: 0 (浅克隆拿不到完整历史, 扫不到历史中的凭据)。
  secret-scan:
    name: Secret scan (history + tracked tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan git history and tracked files
        run: bash tests/scripts/check_no_secrets.sh

  # 发布链路本地验证: 用模拟的 GitHub Release 端到端跑 install.sh / upgrade /
  # dataset / npm 包族, 防止发布路径在 tag 推送前才暴露问题
  release-pipeline-verify:
    name: Release pipeline local verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # ring 的 build script 需编译目标平台 C 代码, musl 目标必须装 musl-tools
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      # install.ps1 是随 Release 发布的资产 (Windows 唯一安装入口), 用 pwsh 在
      # Linux 上验证其逻辑 (URL 构造 / 下载 / Expand-Archive / 安装 / PATH);
      # 装不上 pwsh 时该段自动跳过, 不阻断流水线
      - name: Install PowerShell (optional)
        continue-on-error: true
        run: |
          PWSH_VERSION=7.6.8
          curl -sSL --max-time 300 -o /tmp/pwsh.tar.gz \
            "https://github.com/PowerShell/PowerShell/releases/download/v${PWSH_VERSION}/powershell-${PWSH_VERSION}-linux-x64.tar.gz" \
            && sudo mkdir -p /opt/microsoft/powershell/7 \
            && sudo tar -xzf /tmp/pwsh.tar.gz -C /opt/microsoft/powershell/7 \
            && sudo chmod +x /opt/microsoft/powershell/7/pwsh \
            && sudo ln -sf /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh \
            && pwsh --version \
            || echo "[WARN] pwsh 安装失败, 将跳过 install.ps1 验证"
      - name: Verify release pipeline
        run: python3 tests/scripts/verify_release_pipeline.py

  # 帮助文本 ↔ 参数校验 ↔ 文档 三方一致性: help 里漏写边界/默认值/取值白名单,
  # 或文档提到不存在的参数, 都会在 PR 阶段被拦下
  help-contract:
    name: Help / params / docs contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check help contract
        run: python3 tests/scripts/check_help_contract.py

  # 发布产物自检: tag 发布完成后核对线上 Release —— 资产集合完整、SHA256SUMS 与
  # 资产逐一相符、安装脚本已钉定到该 tag、线上二进制里的 help 与仓库契约一致
  # (防止"仓库已修、发布产物还是旧的")
  verify-published-release:
    name: Verify published release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published release
        run: |
          set -euo pipefail
          python3 tests/scripts/verify_published_release.py --tag "${GITHUB_REF_NAME}"
      # 打包清单的哈希必须与**最终**的 Release 资产一致 —— 每次发版二进制都会
      # 重新构建 (哈希必变), 故清单须随每次发版重新生成。放在发布完成之后校验,
      # 否则并行执行时校验的是半成品 release, 会漏掉漂移。
      - name: Verify packaging manifests against final release
        run: |
          set -euo pipefail
          python3 packaging/generate_manifests.py --check --version "${GITHUB_REF_NAME}"

  # 打包清单 (winget / Homebrew) 必须与 Release 实际资产的哈希一致 —— 抄错或
  # 漏改会让用户装到坏包。CI 用官方 schema 校验格式, 并核对清单里的哈希与
  # 该 tag 的 SHA256SUMS 是否相符
  packaging-manifests:
    name: Validate packaging manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: pip install --quiet --break-system-packages pyyaml jsonschema
      - name: Validate winget manifests against official schema
        run: |
          set -euo pipefail
          for t in version installer defaultLocale; do
            curl -sSL "https://raw.githubusercontent.com/microsoft/winget-cli/master/schemas/JSON/manifests/latest/manifest.${t}.latest.json" -o "/tmp/${t}.json"
          done
          python3 - <<'PYEOF'
          import json, pathlib, sys
          import yaml, jsonschema
          W = pathlib.Path("packaging/winget")
          pairs = [("QYZS-AI.qyzs.yaml", "version"),
                   ("QYZS-AI.qyzs.installer.yaml", "installer"),
                   ("QYZS-AI.qyzs.locale.en-US.yaml", "defaultLocale")]
          bad = 0
          for fname, stype in pairs:
              schema = json.load(open(f"/tmp/{stype}.json"))
              data = yaml.safe_load((W / fname).read_text(encoding="utf-8"))
              errs = list(jsonschema.Draft7Validator(schema).iter_errors(data))
              if errs:
                  bad += 1
                  print(f"[FAIL] {fname}: {errs[0].message[:160]}")
              else:
                  print(f"[PASS] {fname} 符合 {stype} schema")
          sys.exit(1 if bad else 0)
          PYEOF
      - name: Validate manifest hashes against the release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "${GITHUB_REF#refs/tags/}" = "${GITHUB_REF}" ]; then
            echo "[INFO] 非 tag 触发, 跳过哈希比对 (清单随版本发布时更新)"
            exit 0
          fi
          python3 packaging/generate_manifests.py --check --version "${TAG}"

  # 平台相关代码 (`#[cfg(windows)]` / `#[cfg(target_os = "macos")]`) 此前只在
  # tag 触发的发布构建里才被编译, PR 阶段完全无覆盖 —— 本 job 补上该盲区。
  # 各目标在能原生处理它的 runner 上检查, 无需交叉工具链。
  cross-target-check:
    name: Build & type check ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            setup: ""
          - target: x86_64-apple-darwin
            os: macos-15-intel
            setup: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            setup: ""
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            setup: musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # ring (rustls 的 TLS 实现) 的 build script 需编译目标平台 C/汇编代码,
      # musl 目标必须装 musl-tools 才能链接
      - name: Install musl toolchain
        if: matrix.setup == 'musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      # 用 cargo build 而非 cargo check: check 不做链接, 抓不到 FFI 符号缺失这类
      # 只在链接期暴露的错误 (macOS 的 CoreFoundation 符号问题即是被 release
      # 流水线而非本 job 抓到的 —— 本 job 当时只做 check)
      - name: Cargo Build
        run: cargo build --target ${{ matrix.target }} --verbose

  # 先建 Release (含安装脚本与数据集), 再往里上传各平台二进制。
  # 顺序不能反: upload-rust-binary-action 要求 Release **已存在**才能追加资产,
  # 而建 Release 的动作原先放在后面的 job —— 两者互相等待, 发布必然失败
  # (现象是二进制构建成功、随后上传报 "release not found")。
  release-create:
    name: Create Release (install scripts + dataset)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package benchmark dataset (tests_data.zip)
        run: |
          # 打包 tests/data/ 的**内容** (而非 data/ 目录本身): qyzs dataset 的
          # 解压契约是「归档内容原样展开到 --dest」, 若把 data/ 目录打进去,
          # 解到默认的 tests/data 会多出一层 data/
          # 必须 cd 进 data/ 再打包 "." : `zip -r X data/*` 存出来的条目仍是
          # data/<类目>/<文件>, 解到默认的 tests/data 会多出一层 data/
          cd tests/data && zip -qr "${{ github.workspace }}/tests_data.zip" .
      # 发布时把安装脚本的版本钉定到本 tag (业界惯例, 参考 astral-sh/uv):
      # Release 资产里的 install.sh 装的就是该版本, 而仓库 main 分支上的脚本
      # 仍然是「装最新版」。不钉定的话, 从 v0.2.0 下载的脚本会装到更新版本,
      # 资产名与实际行为不符。
      # 替换规则统一走 tests/scripts/pin_install_scripts.sh —— CI 与本地发布验证
      # 脚本共用同一份实现, 避免两侧规则漂移 (曾发生: CI 侧剥掉了 tag 的 v
      # 前缀, 钉出的版本与实际 tag 对不上, Release 下载 URL 404)
      - name: Pin install scripts to this release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          bash tests/scripts/pin_install_scripts.sh "${TAG}"
          grep -n "PINNED_VERSION=" install.sh
          grep -n 'PinnedVersion = ' install.ps1
      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            install.sh
            install.ps1
            install.cmd
            tests_data.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
      # 删除上一轮遗留的 SHA256SUMS: 重打 tag 时旧文件会滞留到新文件上传为止,
      # 期间用户拿旧校验和校验新二进制会被误判为「下载被篡改」而安装失败。
      # 必须放在「建 Release」之后 —— Release 尚不存在时查不到资产 (404)。
      # 清理后到新校验和上传前, 该文件是「缺失」而非「错误」, 安装脚本会降级为
      # 警告并继续, 不会误杀正常下载。
      - name: Remove stale SHA256SUMS from previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          BODY="$(curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")" || BODY=""
          if [ -z "${BODY}" ]; then
            echo "[INFO] 未取到 Release 资产列表 (首次发布?), 跳过清理"
            exit 0
          fi
          echo "${BODY}" | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          for a in d.get('assets', []):
              if a.get('name') == 'SHA256SUMS':
                  print(a['id'])
          " | while read -r asset_id; do
            [ -z "${asset_id}" ] && continue
            echo "删除遗留资产 SHA256SUMS (id=${asset_id})"
            curl -sSL -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            echo
          done
          exit 0

  release-binaries:
    name: Build & Upload Release Binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust-check, release-create]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: qyzs
          target: ${{ matrix.target }}
          archive: $bin-$target
          token: ${{ secrets.GITHUB_TOKEN }}

  # LoongArch 交叉工具链只有 Debian 提供 —— Ubuntu 官方源里只有
  # binutils-loongarch64-linux-gnu, 没有交叉 GCC (24.04 与 26.04 均无),
  # cross 也没有该目标的镜像。故该目标在 Debian trixie 容器内构建。
  release-binary-loongarch64:
    name: Build & Upload loongarch64 binary
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust-check, release-create]
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    permissions:
      contents: write
    steps:
      # 容器内需自带 git (actions/checkout 依赖) 与交叉工具链
      - name: Install build deps
        run: |
          apt-get update
          # libc6-dev-loong64-cross 提供目标 sysroot 的 libc 头文件, 它只是
          # gcc 包的 Recommends (非 Depends), 会被 --no-install-recommends 跳过
          # -> 交叉编译 ring 的 C 代码时报 "bits/libc-header-start.h: No such file"
          apt-get install -y --no-install-recommends git curl ca-certificates build-essential gcc-loongarch64-linux-gnu libc6-dev-loong64-cross
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          # CARGO_HOME / RUSTUP_HOME 必须在安装 rustup **之前**就导出: 否则
          # rustup 装到默认的 /root/.rustup, 而后续步骤指向 /github/rustup,
          # 结果是 "rustup could not choose a version of cargo to run ...
          # no default is configured"
          export CARGO_HOME=/github/home
          export RUSTUP_HOME=/github/rustup
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain stable --target loongarch64-unknown-linux-gnu
          echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
          echo "PATH=$CARGO_HOME/bin:$PATH" >> "$GITHUB_ENV"
          echo "CC_loongarch64_unknown_linux_gnu=loongarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "AR_loongarch64_unknown_linux_gnu=loongarch64-linux-gnu-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_LOONGARCH64_UNKNOWN_LINUX_GNU_LINKER=loongarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --bin qyzs --target loongarch64-unknown-linux-gnu
      - name: Package
        run: tar acf qyzs-loongarch64-unknown-linux-gnu.tar.gz -C target/loongarch64-unknown-linux-gnu/release qyzs
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: qyzs-loongarch64-unknown-linux-gnu.tar.gz
          fail_on_unmatched_files: true

  # 收尾: 全部资产就位后生成 SHA256SUMS 并上传 (行业惯例: bun/uv/deno/gh
  # 都在 Release 里提供校验和, 供用户验证下载完整性; install.sh / install.ps1
  # 会自动对照它, 不匹配即中止安装)
  release-checksums:
    name: Generate & upload SHA256SUMS
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-create, release-binaries, release-binary-loongarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for a in d.get('assets', []):
              print(a['name'], a['browser_download_url'])
          " | while read -r name url; do
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -o "assets/${name}" "$url"
          done
          ls -la assets/
      - name: Compute SHA256SUMS
        run: |
          set -euo pipefail
          cd assets
          # sha256sum 格式: <hash>  <name>  (可被 sha256sum -c 直接消费)
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Upload SHA256SUMS
        uses: softprops/action-gh-release@v2
        with:
          files: assets/SHA256SUMS
          fail_on_unmatched_files: true

  release-npm:
    name: Publish npm packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-binaries, release-binary-loongarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Determine Version
        id: ver
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release version: $TAG"

      # npm/build.sh 期望 dist/<bin>-<pkg> 形式的二进制; release-binaries job
      # 只把产物传到 Release 资产, 这里下载回来放到约定路径 —— 否则平台包会
      # 带着空 bin/ 发布 (装上去运行不了)
      - name: Fetch platform binaries from Release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          declare -A ASSET=(
            [qyzs-linux-x64]="qyzs-x86_64-unknown-linux-musl.tar.gz"
            [qyzs-linux-arm64]="qyzs-aarch64-unknown-linux-musl.tar.gz"
            [qyzs-linux-loong64]="qyzs-loongarch64-unknown-linux-gnu.tar.gz"
            [qyzs-darwin-x64]="qyzs-x86_64-apple-darwin.tar.gz"
            [qyzs-darwin-arm64]="qyzs-aarch64-apple-darwin.tar.gz"
            [qyzs.exe-win32-x64]="qyzs-x86_64-pc-windows-msvc.zip"
          )
          mkdir -p dist
          for dest in "${!ASSET[@]}"; do
            asset="${ASSET[$dest]}"
            curl -fsSL -o "/tmp/${asset}" "${BASE}/${asset}"
            tmp="$(mktemp -d)"
            case "${asset}" in
              *.zip)  unzip -q -j "/tmp/${asset}" -d "${tmp}" ;;
              *.tar.gz) tar -xzf "/tmp/${asset}" -C "${tmp}" qyzs ;;
            esac
            if [ "${dest}" = "qyzs.exe-win32-x64" ]; then
              cp "${tmp}/qyzs.exe" "dist/${dest}"
            else
              cp "${tmp}/qyzs" "dist/${dest}"
            fi
            chmod +x "dist/${dest}"
            rm -rf "${tmp}"
          done
          ls -l dist/

      - name: Pack npm packages
        run: bash npm/build.sh ${{ steps.ver.outputs.version }}

      - name: Pack npm packages
        run: bash npm/build.sh ${{ steps.ver.outputs.version }}

      - name: npm Auth
        if: env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc

      - name: Publish platform packages
        if: env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for pkg in linux-x64 linux-arm64 linux-loong64 darwin-arm64 darwin-x64 win32-x64; do
            if [ -d "dist/npm/$pkg" ]; then
              if npm view "@qyzs-ai/$pkg@${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
                echo "Skip @qyzs-ai/$pkg (already published)"
                continue
              fi
              echo "Publish @qyzs-ai/$pkg"
              # 不用 || true 吞错: 发布失败必须让 job 变红, 否则 "成功" 是假象
              # (曾因 NPM_TOKEN 缺失被吞, job 绿而 npm registry 上什么都没有)
              (cd "dist/npm/$pkg" && npm publish --provenance --access public)
            fi
          done

      - name: Publish top-level @qyzs-ai/cli
        if: env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if npm view "@qyzs-ai/cli@${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "Skip @qyzs-ai/cli (already published)"
          else
            (cd dist/npm/cli && npm publish --provenance --access public)
          fi
