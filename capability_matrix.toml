# capability_matrix.toml
# 庆阳智算中心模型能力调度矩阵（SSOT 校准真值）
#
# 数据来源：tests/scripts/run_benchmarks.py + stress_limits.py + limit_probe*.py
#           + probe_ocr_models.py
# 最近复核：2026-10-26；明细见 tests/docs/QYZS-ANALYZE.md 与 tests/scripts/*_summary.json
#
# [model.params.*] 段与 qyzs CLI 的 ~/.config/qyzs/config.toml 模式兼容，
# 可整段复制进用户配置使 CLI 按 Bearer 网关实测边界自动调度。

[model]
default_chat = "dsv4"
# 图像转录模型: 原 ocr 子命令已并入 markscan, 该项现供 markscan 图像通道使用
default_ocr = "qwen36"
# 文档解析模型 (MinerU 专线): 原 parse 子命令已并入 markscan, 现由 markscan 读取
default_parse = "mineru3.2.3"
default_embed = "bge-m3"
default_rerank = "qwen3-reranker-8b"
default_asr = "Qwen3-ASR-1.7B"
default_sam = "acid-sam3-full"

# ── 文本推理 ─────────────────────────────────────────────────────────────
# dsv4：短文本 ~1.0s；上下文实测 518,438 Tokens（约 105 万字符）100% 针孔召回，
#       梯度内未见天花板，延时约 0.25 ms/Token。
#       temperature 服务端硬校验区间 [0, 2]（越界 400）；max_tokens 1~65536 均接受。
[model.params.dsv4]
temperature = 0.2
max_tokens = 8192

# qwen3.6-27b：思维链模型（content 为空时回退 reasoning 字段）；
#   上下文实测 138,028 Tokens 100% 召回（梯度内未触顶），13.8 万 Tokens 延时约 237s，
#   建议仅在 ≤3 万 Tokens 场景使用；max_tokens 必须预留 ≥2048 思维链预算，
#   否则推理 Tokens 耗尽预算导致 content 为空（temperature 实测 8.0 仍被接受，生产约束 0~2）。
[model.params.qwen3_6_27b]
temperature = 0.4
max_tokens = 4096

# ── 视觉多模态 ───────────────────────────────────────────────────────────
# qwen3-VL-30B-A3B：文本通道硬上限 131,072 Tokens（服务端报错确认，102,188 实测通过）；
#   多图可靠工作点 16 图/请求（4 图计数准确，8/16 图漏数 1；网关可承载 ≥48 图/13.2 MB
#   但 32 图起输出为空）——客户端 >16 图必须分批。
[model.params.qwen3_VL_30B_A3B]
temperature = 0.1
max_tokens = 2048

# paddleocrvl：FastDeploy max_model_len=2048 硬限；2026-10-26 三份公开样本实测
#   800/1024/1152/1280/1408px 全部接受，1536px 起全部因 input_ids_len=2047 拒绝。
#   当前部署推荐 1280px，样本安全上沿 1408px；边界受宽高比/视觉 Token 共同影响，
#   不是与内容无关的普适长边硬限。
[model.params.paddleocrvl]
temperature = 0.0
max_tokens = 2048
#   2026-10-26 专项尺寸探针曾恢复；同日最终发布前两次复测均再次返回
#   Request timed out / base_url_missing，当前禁止调度，保留历史尺寸能力证据。

# ── OCR / 文档视觉能力（机器可读；调度器只使用已实测字段）──────────────
# `null` 不属于 TOML，未知上限直接省略，严禁把未测值写成猜测值。
[ocr_capabilities]
schema_version = 1

[[ocr_capabilities.models]]
id = "paddleocrvl"
aliases = ["paddleocr-vl"]
transport = "chat-completions"
roles = ["text-ocr", "document-transcription"]
input_mime = ["image/png", "image/jpeg"]
online_at_test = false
tested_at = "2026-10-26"
max_tested_accepted_long_edge = 1408
min_tested_rejected_long_edge = 1536
recommended_long_edge = 1280
max_output_tokens = 2048
supports_bbox = false
supports_native_confidence = false
supports_reading_order = false
supports_table_structure = false
evidence = "历史尺寸探针：3 样本×9 尺寸，≤1408px 全接受，≥1536px 因 max_model_len=2048 拒绝；2026-10-26 最终复测连续两次约 21 秒后 Request timed out / base_url_missing，当前不可调度"

[[ocr_capabilities.models]]
id = "qwen3-VL-30B-A3B"
aliases = ["qwen3-vl"]
transport = "chat-completions"
roles = ["vision-ocr", "layout-understanding", "image-description"]
input_mime = ["image/png", "image/jpeg", "image/webp"]
online_at_test = true
tested_at = "2026-10-26"
max_tested_accepted_long_edge = 4096
max_images = 16
max_output_tokens = 2048
supports_bbox = false
supports_native_confidence = false
supports_reading_order = "prompt-derived"
supports_table_structure = "markdown-derived"
evidence = "3 样本在 800/1024/2048/4096px 共 12 次全接受；4096px 仅为已测通过点，不代表硬上限；16 图可靠工作点"

[[ocr_capabilities.models]]
id = "qwen36"
aliases = ["Qwen3.6-35B-A3B"]
transport = "chat-completions"
roles = ["vision-ocr", "layout-understanding", "arbitration"]
input_mime = ["image/png", "image/jpeg"]
online_at_test = true
tested_at = "2026-10-26"
max_tested_accepted_long_edge = 4096
supports_bbox = false
supports_native_confidence = false
supports_reading_order = "prompt-derived"
supports_table_structure = "markdown-derived"
evidence = "3 样本在 800/1024/2048/4096px 共 12 次全接受；4096px 仅为已测通过点，不代表硬上限；多图与输出极限待专项探测"

[[ocr_capabilities.models]]
id = "mymodel-paddleocr-udhyfg"
aliases = ["paddleocr"]
transport = "chat-completions"
roles = ["text-ocr"]
input_mime = ["image/png", "image/jpeg"]
online_at_test = false
tested_at = "2026-10-26"
supports_bbox = false
supports_native_confidence = false
supports_reading_order = false
supports_table_structure = false
evidence = "网关 base_url_missing；输入与输出极限尚不可测"

# ── 向量表征（批量 ≥256 条/请求；越界一律 HTTP 500）────────────────────────
# bge-m3：1024 维；单条输入 ≤13,000 字符（16,000 拒绝）→ 长文本按 ≤12,000 字符分块。
# qwen3-embadding-8b：4096 维；单条输入 ≤12,000 字符（13,000 拒绝）。
# bge-large-zh-v1.5：1024 维短向量模型；单条输入 ≤约 500 字符（≈800 拒绝），仅限短句。

# ── 语义重排（候选集 200 篇实测可用；CLI 分批切片 ≤100 篇/批）───────────────
# bge-reranker-v2-m3：0.37s@10 篇 → 1.49s@200 篇，Top1 稳定（首选）。
# qwen3-reranker-8b：0.42s@10 篇 → 3.46s@200 篇（大候选集延迟约 2.3 倍，Top1 > 0.90）。
# bge-reranker-large：同 v2-m3 量级，但同质语料下 Top1 漂移，仅作基础过滤。

# ── 响应 usage 字段（2026-10-18 实测，qyzs usage 台账数据源）─────────────────
# chat/completions：非流式响应自带 usage；流式经 stream_options.include_usage
#   在收尾 chunk（choices 为空）回传完整 usage（prompt/completion/total）。
# embeddings：usage 含 prompt_tokens/total_tokens（长文本分块后客户端聚合）。
# rerank：usage 仅 total_tokens，无 prompt/completion 拆分。
# mineru/sam：任务型接口，无 Token 数据。

# ── 文档解析 ─────────────────────────────────────────────────────────────
# mineru3.2.3：同步通道实测 30 页（0.2 MB）7.7s 无断点，约 0.26 s/页。
#   **CLI 仅实现同步通道**：无 /tasks 端点、无轮询循环、无自动转异步；
#   网关返回 pending/running 时直接报错，提示减小页数或体积后重试
#   （src/client/mineru.rs）。要落地「同步/异步自动切换」须先补异步通道实现。
#   2026-10-18 实测（markscan 通道验证）：.doc 旧版 Word 不被网关接受
#   （HTTP 400 {"detail":"Unsupported file type: doc"}）；.docx 正常。
#   客户端路由按此约束：.doc 明确报错并提示另存为 .docx。
#   2026-10-18 补充实测：40 页/10.7MB 文档同步通道 15.9s 完成（三批串行）；
#   空白页文档 md_content 为空属合法返回。
#   2026-10-26 复核：清单显示名「MinerU3.2.3」对应调用 ID 仍为 mineru3.2.3
#   （ai-gateway/MinerU/file_parse 实测 404；5 页文本 PDF 5.2s completed）。
#   qwen3-VL 非流式偶发完整回答置于 reasoning 字段而 content 为空（客户端
#   ChatResponse::primary_text 已统一回退）。

# ── 离线/禁用路由（实测禁止调度）────────────────────────────────────────────
# 已结构化进 [models.matrix] 的 `online = false` 行（`qyzs models --all-models`
# 可见），此处不再重复枚举。

# ── CLI `qyzs models` 渲染数据 ──────────────────────────────────────────────
# `qyzs models` 由本段数据驱动渲染（编译期嵌入二进制）。延时与特性描述与
